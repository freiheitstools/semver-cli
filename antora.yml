name: cli
title: SemVer Commandline Client
start_page: index.adoc
version: ~
asciidoc:
  attributes:
    page-toclevels: 3

nav:
  - modules/ROOT/nav.adoc

ext:
  collector:
    run:
      - command: modules/ROOT/bin/run-generation-of-examples.sh
      - command: modules/ROOT/bin/run-generation-of-synopsis-files.sh
    scan:
      dir: modules/ROOT/generated-files
      files: '**/*.incl'
      into: modules/ROOT/examples

